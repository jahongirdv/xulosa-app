name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl python-docx docxtpl docxcompose pyinstaller ttkwidgets

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name "XulosaGenerator" --collect-data "docxcompose" --add-data "shablon.docx;." main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XulosaGenerator-Windows
          path: dist/XulosaGenerator.exe
